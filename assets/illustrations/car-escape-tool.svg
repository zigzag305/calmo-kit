<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <rect width="1000" height="1000" fill="#FFFFFF"/>
  <ellipse cx="500" cy="850" rx="360" ry="30" fill="#E9E4D8"/>
  <!-- key ring -->
  <circle cx="330" cy="250" r="95" fill="none" stroke="#8A8F8B" stroke-width="22"/>
  <!-- car key -->
  <g transform="translate(150 300) rotate(-28)">
    <rect x="0" y="0" width="150" height="230" rx="56" fill="#1C1F1D"/>
    <circle cx="75" cy="80" r="22" fill="#3A3F3B"/><circle cx="75" cy="150" r="22" fill="#3A3F3B"/>
    <rect x="52" y="225" width="46" height="250" rx="10" fill="#B9BDB8"/>
    <path d="M52 330h30M52 380h20M52 430h30" stroke="#8A8F8B" stroke-width="10"/>
  </g>
  <!-- escape tool body -->
  <g transform="translate(470 300) rotate(18)">
    <rect x="0" y="0" width="190" height="470" rx="70" fill="#0B6E4F" stroke="#1C1F1D" stroke-width="12"/>
    <!-- tip (window punch) -->
    <rect x="62" y="438" width="66" height="60" rx="16" fill="#1C1F1D"/>
    <circle cx="95" cy="500" r="14" fill="#B9BDB8"/>
    <!-- seatbelt cutter slot -->
    <path d="M95 120c-40 0-60 40-60 80v40h120v-40c0-40-20-80-60-80z" fill="#1C1F1D"/>
    <path d="M60 210l35-55 35 55" fill="none" stroke="#B9BDB8" stroke-width="10" stroke-linejoin="round"/>
    <!-- ring hole -->
    <circle cx="95" cy="52" r="22" fill="#FFFFFF" stroke="#1C1F1D" stroke-width="8"/>
    <rect x="45" y="300" width="100" height="12" rx="6" fill="#F4F1EA" opacity="0.6"/>
    <rect x="45" y="330" width="100" height="12" rx="6" fill="#F4F1EA" opacity="0.6"/>
  </g>
  <path d="M398 296c40-8 80 20 110 40" fill="none" stroke="#8A8F8B" stroke-width="16" stroke-linecap="round"/>
</svg>
