<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalmoKit — Radio de Emergencia Solar y Dinamo (España y Portugal)</title>
    <meta
      name="description"
      content="Prepárate para el próximo apagón con la Radio de Emergencia Solar y Dinamo (€44,90): AM/FM, panel solar, manivela, linterna LED, alarma SOS y carga USB. Envío en 2–3 semanas a España peninsular y Portugal continental."
    />
    <meta
      name="keywords"
      content="radio de emergencia solar, radio dinamo apagon, radio manivela emergencia, preparacion apagones espana portugal, calmokit"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://calmokit.eu/" />
    <link rel="alternate" hreflang="es" href="https://calmokit.eu/" />
    <link rel="alternate" hreflang="pt" href="https://calmokit.eu/?lang=pt" />
    <link rel="alternate" hreflang="en" href="https://calmokit.eu/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://calmokit.eu/" />

    <!-- Preload above-the-fold LCP hero product photo -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/images/products/gear-weather-radio-480.webp 480w, /images/products/gear-weather-radio.webp 1000w"
      imagesizes="(min-width: 1024px) 420px, 90vw"
      fetchpriority="high"
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C1F1D" />

    <!-- Open Graph / Social -->
    <meta property="og:site_name" content="CalmoKit" />
    <meta property="og:title" content="CalmoKit — Prepárate para el próximo apagón" />
    <meta
      property="og:description"
      content="Radio de Emergencia Solar y Dinamo (€44,90): noticias, luz y batería para el móvil cuando se va la luz. Envío en 2–3 semanas a España y Portugal."
    />
    <meta property="og:url" content="https://calmokit.eu/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://calmokit.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CalmoKit — Prepárate para el próximo apagón" />
    <meta
      name="twitter:description"
      content="Radio de Emergencia Solar y Dinamo (€44,90): noticias, luz y batería para el móvil cuando se va la luz. Envío en 2–3 semanas."
    />
    <meta name="twitter:image" content="https://calmokit.eu/og-image.png" />

    <!-- Fonts are self-hosted (@fontsource, imported in src/main.tsx): loading
         Google Fonts from Google's servers sends visitors' IPs to Google
         without consent, which a German court fined a site for in 2022. -->

    <!-- Structured Data (SEO + AEO/GEO Rich Results) -->
    <!-- Structured data is generated from the product catalog at build time (src/seo/schema.ts). -->
    <!--SCHEMA_JSONLD-->
  </head>
  <body class="bg-[#F4F1EA] text-[#1C1F1D] antialiased selection:bg-[#0B6E4F] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
