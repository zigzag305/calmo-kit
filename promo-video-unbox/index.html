<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"introHook","type":"string","label":"Unboxing Hook","default":"WHAT’S INSIDE A\n$189 SURVIVAL KIT?"},
    {"id":"storeDomain","type":"string","label":"Store URL","default":"WWW.CALMOKIT.COM"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #f5f5f7;
        --ink: #0f172a;
        --blue: #2563eb;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-display);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="unbox-intro"
        class="clip"
        data-composition-id="unbox-intro"
        data-composition-src="compositions/unbox-intro.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="unbox-gear1"
        class="clip"
        data-composition-id="unbox-gear1"
        data-composition-src="compositions/unbox-gear1.html"
        data-start="3.5"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="unbox-gear2"
        class="clip"
        data-composition-id="unbox-gear2"
        data-composition-src="compositions/unbox-gear2.html"
        data-start="7.5"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="unbox-close"
        class="clip"
        data-composition-id="unbox-close"
        data-composition-src="compositions/unbox-close.html"
        data-start="11.5"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
