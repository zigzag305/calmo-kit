<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"brandName","type":"string","label":"Brand Name","default":"CALMO KIT"},
    {"id":"domainUrl","type":"string","label":"Store URL","default":"WWW.CALMOKIT.COM"},
    {"id":"hookTitle","type":"string","label":"Hook Headline","default":"STAY CALM.\nSTAY READY."},
    {"id":"ctaSub","type":"string","label":"CTA Subtitle","default":"FREE SHIPPING OVER $99 · EXPLORE IN 3D"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #080b10;
        --ink: #ffffff;
        --accent: #39ff14;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-display);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="scene-hook"
        class="clip"
        data-composition-id="scene-hook"
        data-composition-src="compositions/scene-hook.html"
        data-start="0"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-crisis"
        class="clip"
        data-composition-id="scene-crisis"
        data-composition-src="compositions/scene-crisis.html"
        data-start="3.5"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-lineup"
        class="clip"
        data-composition-id="scene-lineup"
        data-composition-src="compositions/scene-lineup.html"
        data-start="7.5"
        data-duration="4"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="scene-cta"
        class="clip"
        data-composition-id="scene-cta"
        data-composition-src="compositions/scene-cta.html"
        data-start="11.5"
        data-duration="3.5"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
